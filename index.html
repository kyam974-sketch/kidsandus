// ── SUPABASE ──────────────────────────────────────────────────────────────────
async function sbFetch(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer||"return=representation",
      ...(opts.headers||{})
    }, ...opts
  });
  if (!res.ok) throw new Error(await res.text());
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function getGroupStudents(sede,corso,giorno) {
  const e=encodeURIComponent;
  const rows = await sbFetch(`group_students?sede=eq.${e(sede)}&corso=eq.${e(corso)}&giorno=eq.${e(giorno)}&limit=1`);
  return rows&&rows.length>0 ? rows[0] : null;
}

async function upsertGroupStudents(sede,corso,giorno,students) {
  const existing = await getGroupStudents(sede,corso,giorno);
  if (existing) {
    await sbFetch(`group_students?id=eq.${existing.id}`,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify({students})});
  } else {
    await sbFetch("group_students",{method:"POST",prefer:"return=minimal",body:JSON.stringify({sede,corso,giorno,students})});
  }
}

async function saveSession(session) {
  return await sbFetch("followup_sessions",{method:"POST",prefer:"return=representation",body:JSON.stringify(session)});
}

async function loadSessionHistory(sede,corso,giorno) {

  return await sbFetch(`followup_sessions?sede=eq.${e(sede)}&corso=eq.${e(corso)}&giorno=eq.${e(giorno)}&order=session_date.desc&limit=40`);
}

async function loadAllGroupsWithHistory() {
  return await sbFetch(`followup_sessions?select=sede,corso,giorno&order=sede.asc,corso.asc,giorno.asc`);
}

function readFileAsBase64(file) {
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(",")[1]);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs) for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class") e.className=v;
    else if(k==="disabled"&&v) e.disabled=true;
    else if(k==="rows") e.rows=v;
    else if(k==="placeholder") e.placeholder=v;
    else if(k==="value"&&(tag==="textarea"||tag==="input")) e.value=v;
    else e.setAttribute(k,v);
  }
  for(const c of children){
    if(c==null) continue;
    if(typeof c==="string"||typeof c==="number") e.appendChild(document.createTextNode(c));
    else if(c instanceof Node) e.appendChild(c);
    else if(Array.isArray(c)) c.forEach(cc=>{ if(cc instanceof Node) e.appendChild(cc); });
  }
  return e;
}

async function openSession(){

  try {
    const row=await getGroupStudents(state.sede,state.corso,state.giorno);
    state.students=row?(row.students||[]):[];
  } catch(e){ state.students=[]; }
  state.presentStudents=[...state.students];
  state.groupNote=""; state.pdfFile=null; state.pdfBase64=null; state.pdfName="";
  state.entries={}; state.generating=false; state.generatingMode=null;
  state.generated=false; state.saving=false; state.saved=false; state.newStudent="";
  state.view="session"; render();

  studCard.appendChild(el("div",{class:"card-title"},"👥 Presenze"));
  if(state.students.length===0) studCard.appendChild(el("div",{class:"card-subtitle"},"Nessun allievo ancora — aggiungili qui sotto, verranno salvati per questo gruppo."));
  const grid=el("div",{class:"student-grid"});
  state.students.forEach(name=>{
    const present=state.presentStudents.includes(name);
    const btn=el("button",{class:"pres-btn "+(present?"present":"absent"),onClick:()=>{
      if(present) state.presentStudents=state.presentStudents.filter(s=>s!==name);
      else state.presentStudents=[...state.presentStudents,name];
      render();
    }},(present?"✓ ":"✗ ")+name);
    const del=el("button",{class:"del-btn",onClick:async()=>{
      state.students=state.students.filter(s=>s!==name);
      state.presentStudents=state.presentStudents.filter(s=>s!==name);
      await upsertGroupStudents(state.sede,state.corso,state.giorno,state.students).catch(()=>{});
      render();
    }},"×");
    grid.appendChild(el("div",{class:"student-item"},btn,del));
  });
  const addInput=el("input",{type:"text",placeholder:"Nome allievo...",value:state.newStudent});
  addInput.addEventListener("input",e=>{ state.newStudent=e.target.value; });
  addInput.addEventListener("keydown",e=>{ if(e.key==="Enter") doAddStudent(); });
  studCard.append(grid,el("div",{class:"add-row"},addInput,el("button",{class:"add-btn",onClick:doAddStudent},"+")));
  body.appendChild(studCard);

  // PDF
  const pdfCard=el("div",{class:"card"});
  pdfCard.appendChild(el("div",{class:"card-title"},"📄 Lezione del giorno"));
  pdfCard.appendChild(el("div",{class:"card-subtitle"},"Carica il PDF della lezione — l'AI lo leggerà per basare i giudizi sulle attività svolte."));
  const pdfInput=document.createElement("input");
  pdfInput.type="file"; pdfInput.accept=".pdf,application/pdf";
  pdfInput.addEventListener("change",async e=>{
    const file=e.target.files[0]; if(!file)return;
    state.pdfFile=file; state.pdfName=file.name;
    state.pdfBase64=await readFileAsBase64(file).catch(()=>null);
    render();
  });
  const pdfZone=el("div",{class:"pdf-zone"+(state.pdfName?" loaded":""),onClick:()=>pdfInput.click()});
  pdfZone.appendChild(el("div",{class:"pdf-label"},state.pdfName||"📎 Tocca per caricare il PDF"));
  pdfZone.appendChild(el("div",{class:"pdf-sublabel"},state.pdfName?"✅ PDF caricato — tocca per cambiarlo":"Formato PDF accettato"));
  pdfCard.appendChild(pdfZone);
  pdfCard.appendChild(pdfInput);
  body.appendChild(pdfCard);

  // NOTA + GENERA
  const noteCard=el("div",{class:"card"});
  noteCard.appendChild(el("div",{class:"card-title"},"📝 Nota di gruppo"));
  noteCard.appendChild(el("div",{class:"card-subtitle"},"Opzionale — dinamiche, episodi particolari, clima della classe."));
  const ta=el("textarea",{rows:3,placeholder:"Es. lezione molto partecipata, abbiamo lavorato sui colori con le flashcard..."});
  ta.value=state.groupNote;
  ta.addEventListener("input",e=>{ state.groupNote=e.target.value; });
  noteCard.appendChild(ta);

  const genRow=el("div",{class:"gen-row"});
  const btnA=el("button",{class:"generate-btn",style:{opacity:state.generating?"0.5":"1"},onClick:()=>handleGenerate("fromNote")});
  btnA.innerHTML=state.generating&&state.generatingMode==="fromNote"?`<span class="spinner"></span>Generando...`:"✨ PDF+Nota → Note+Emoji";
  const btnB=el("button",{class:"generate-btn secondary",style:{opacity:state.generating?"0.5":"1"},onClick:()=>handleGenerate("fromEmoji")});
  btnB.innerHTML=state.generating&&state.generatingMode==="fromEmoji"?`<span class="spinner dark"></span>Generando...`:"😊 Emoji → Note";
  genRow.append(btnA,btnB);
  noteCard.appendChild(genRow);
  noteCard.appendChild(el("div",{class:"mode-hint"},"A: carica PDF (+ nota opzionale) → genera tutto · B: assegna emoji → genera i testi"));
  body.appendChild(noteCard);

  // VALUTAZIONI
  if(state.presentStudents.length>0){
    const ec=el("div",{class:"card"});
    ec.appendChild(el("div",{class:"card-title"},"👤 Valutazioni individuali"));
    state.presentStudents.forEach(name=>{
      const entry=getEntry(name);
      const hasData=entry.note||(entry.motivation||entry.learning||entry.behaviour);
      const nc=el("div",{class:"entry-card"+(hasData?" has-data":"")});
      const copied=state.copiedKey===name;
      const copyBtn=el("button",{class:"copy-btn"+(copied?" copied":""),onClick:()=>{
        navigator.clipboard.writeText(entry.note||"").catch(()=>{});
        state.copiedKey=name; render();
        setTimeout(()=>{ state.copiedKey=null; render(); },1500);
      }},copied?"✓ Copiato":"📋 Copia");
      nc.appendChild(el("div",{class:"entry-name"},el("span",{},name),copyBtn));
      // Emoji
      const rr=el("div",{class:"ratings-row"});
      RATING_FIELDS.forEach(field=>{
        const rg=el("div",{class:"rating-group"});
        rg.appendChild(el("div",{class:"rating-label"},RATING_LABELS[field]));
        const er=el("div",{class:"emoji-row"});
        EMOJI_SCALE.forEach(es=>{
          const b=el("button",{class:"emoji-btn"+(entry[field]===es.value?" selected":""),title:es.label,onClick:()=>{ setEntry(name,{[field]:entry[field]===es.value?null:es.value}); render(); }},es.emoji);
          er.appendChild(b);
        });
        rg.appendChild(er); rr.appendChild(rg);
      });
      nc.appendChild(rr);
      const noteTa=el("textarea",{class:"note-txt",rows:3,placeholder:"Nota individuale..."});
      noteTa.value=entry.note||"";
      noteTa.addEventListener("input",e=>{ setEntry(name,{note:e.target.value}); });
      nc.appendChild(noteTa);
      ec.appendChild(nc);
    });

    if(!state.saved){
      const sb=el("button",{class:"save-btn",style:{opacity:state.saving?"0.5":"1"},onClick:handleSave});
      sb.innerHTML=state.saving?'<span class="spinner"></span>Salvando...':"☁️ Salva su Supabase";
      ec.appendChild(sb);
    } else {
      ec.appendChild(el("div",{class:"saved-msg"},"✅ Lezione salvata!"));
    }
    body.appendChild(ec);
  }

  root.append(header,body);
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
async function openHistory(){
  state.view="history"; state.historyView="groups";
  state.historyGroups=[]; state.historyGroupsLoading=true; render();
  try {
    const rows=await loadAllGroupsWithHistory()||[];
    const seen=new Set();
    state.historyGroups=rows.filter(r=>{
      const k=`${r.sede}|${r.corso}|${r.giorno}`;
      if(seen.has(k))return false; seen.add(k); return true;
    });
  } catch(e){ state.historyGroups=[]; }
  state.historyGroupsLoading=false; render();
}

function renderHistory(root){
  const header=el("div",{class:"header"},
    el("button",{class:"btn-header",onClick:()=>{ state.view="home"; render(); }},"← Home"),
    el("span",{class:"logo-text"},"📋 Storico")
  );
  const body=el("div",{class:"body"});

  if(state.historyView==="groups"){
    if(state.historyGroupsLoading){
      body.appendChild(el("div",{class:"empty"},"⏳ Caricamento..."));
    } else if(state.historyGroups.length===0){
      body.appendChild(el("div",{class:"empty"},"Nessuno storico ancora."));
    } else {
      body.appendChild(el("div",{style:{fontSize:"13px",color:"#6b7280",marginBottom:"12px"}},"Seleziona un gruppo:"));
      const pills=el("div",{class:"group-pills"});
      SEDI.forEach(sede=>{
        const sg=state.historyGroups.filter(g=>g.sede===sede);
        if(sg.length===0)return;
        pills.appendChild(el("div",{class:"sede-section-label"},sede));
        sg.forEach(g=>{
          const pill=el("button",{
            class:"group-pill",
            style:{background:"#f0fdfa",color:"#0d9488",border:"2px solid #0d9488"},
            onClick:async()=>{
              state.historySelected={sede:g.sede,corso:g.corso,giorno:g.giorno};
              state.historyView="sessions"; state.historySessionsLoading=true;
              state.historySessions=[]; render();
              try{ state.historySessions=await loadSessionHistory(g.sede,g.corso,g.giorno)||[]; }
              catch(e){ state.historySessions=[]; }
              state.historySessionsLoading=false; render();
            }
          },`${g.corso} · ${g.giorno}`);
          pills.appendChild(pill);
        });
      });
      body.appendChild(pills);
    }
  } else {
    const hs=state.historySelected;
    body.appendChild(el("button",{class:"btn-back-sm",onClick:()=>{ state.historyView="groups"; render(); }},"← Gruppi"));
    body.appendChild(el("div",{class:"history-title"},`${hs.sede} · ${hs.corso} · ${hs.giorno}`));
    if(state.historySessionsLoading){
      body.appendChild(el("div",{class:"empty"},"⏳ Caricamento..."));
    } else if(state.historySessions.length===0){
      body.appendChild(el("div",{class:"empty"},"Nessuna sessione trovata."));
    } else {
      state.historySessions.forEach(session=>{
        const card=el("div",{class:"history-card"});
        card.appendChild(el("div",{class:"history-meta"},fmtDate(session.session_date)));
        if(session.group_note) card.appendChild(el("div",{class:"history-group-note"},"📝 "+session.group_note));
        const entries=session.entries||[];
        const present=entries.map(e=>e.name).join(", ");
        if(present) card.appendChild(el("div",{class:"history-present"},"Presenti: "+present));
        entries.forEach(entry=>{
          const row=el("div",{class:"history-row"});
          const rats=[entry.motivation,entry.learning,entry.behaviour].map(emojiFor).filter(Boolean).join(" ");
          const ratsHtml = rats ? ' <span class="history-ratings">'+rats+'</span>' : '';
          row.innerHTML='<strong>'+entry.name+':</strong>'+ratsHtml+' '+(entry.note||'');
          card.appendChild(row);
        });
        body.appendChild(card);
      });
    }
  }
  root.append(header,body);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function doAddStudent(){
  const name=state.newStudent.trim();
  if(!name||state.students.includes(name))return;
  state.students=[...state.students,name];
  state.presentStudents=[...state.presentStudents,name];
  state.newStudent="";
  await upsertGroupStudents(state.sede,state.corso,state.giorno,state.students).catch(()=>{});
  render();
}

function buildPrompt(mode){
  const present=state.presentStudents;
  const corsoContext = CORSO_INFO[state.corso] || `Corso: ${state.corso}`;
  const pdfCtx=state.pdfBase64?"Il PDF della lezione è allegato — leggilo per capire le attività svolte e gli obiettivi didattici del giorno.":"";
  const noteCtx=state.groupNote.trim()?`\nNota generale: "${state.groupNote}"`:"";

  if(mode==="fromNote"){
    return `Sei un assistente per insegnanti Kids&Us in Italia. Genera valutazioni interne per uso esclusivo dell'insegnante (base per le pagelle).

PROFILO DEL CORSO:
${corsoContext}

${pdfCtx}${noteCtx}
Allievi presenti: ${present.join(", ")}.

Per ciascun allievo presente genera:
1. Nota valutativa in italiano di 2-3 frasi (professionale, oggettiva, calibrata sull'età e il livello del corso, basata sulle attività del PDF)
2. Valore 1-5 per: motivation (partecipazione e motivazione), learning (apprendimento rispetto agli obiettivi del corso), behaviour (comportamento, calibrato sull'età)
   Scala: 1=Poor 2=Satisfactory 3=Good 4=Very good 5=Excellent

Rispondi SOLO con JSON valido senza markdown:
{"NomeAllievo": {"note":"testo","motivation":4,"learning":3,"behaviour":5}, ...}`;
  } else {
    const ratingsDesc=present.map(name=>{
      const e=getEntry(name);
      const parts=[];
      if(e.motivation) parts.push(`motivation: ${EMOJI_SCALE.find(x=>x.value===e.motivation)?.label}`);
      if(e.learning)   parts.push(`learning: ${EMOJI_SCALE.find(x=>x.value===e.learning)?.label}`);
      if(e.behaviour)  parts.push(`behaviour: ${EMOJI_SCALE.find(x=>x.value===e.behaviour)?.label}`);
      return `${name}: ${parts.length>0?parts.join(", "):"nessuna valutazione"}`;
    }).join("\n");
    return `Sei un assistente per insegnanti Kids&Us in Italia. Genera note valutative interne basandoti sulle valutazioni emoji dell'insegnante.

PROFILO DEL CORSO:
${corsoContext}

${pdfCtx}${noteCtx}

Valutazioni emoji (1=Poor 2=Satisfactory 3=Good 4=Very good 5=Excellent):
${ratingsDesc}

Per ciascun allievo scrivi nota in italiano di 2-3 frasi coerente con i livelli indicati, calibrata sull'età e il livello del corso.

Rispondi SOLO con JSON valido senza markdown:
{"NomeAllievo": "testo nota", ...}`;
  }
}

async function handleGenerate(mode){
  if(state.presentStudents.length===0){ alert("Segna almeno un allievo come presente."); return; }
  if(mode==="fromNote"&&!state.groupNote.trim()&&!state.pdfBase64){ alert("Carica il PDF della lezione o scrivi una nota di gruppo."); return; }
  if(mode==="fromEmoji"){
    const hasAny=state.presentStudents.some(n=>{ const e=getEntry(n); return e.motivation||e.learning||e.behaviour; });
    if(!hasAny){ alert("Assegna almeno un'emoji a qualche allievo."); return; }
  }
  state.generating=true; state.generatingMode=mode; render();

  const messages=[];
  if(state.pdfBase64){
    messages.push({role:"user",content:[
      {type:"document",source:{type:"base64",media_type:"application/pdf",data:state.pdfBase64}},
      {type:"text",text:buildPrompt(mode)}
    ]});
  } else {
    messages.push({role:"user",content:buildPrompt(mode)});
  }

  try{
    const resp=await fetch("/api/generate",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,messages})
    });
    const data=await resp.json();
    const text=(data.content||[]).map(b=>b.text||"").join("");
    const clean=text.replace(/```json|```/g,"").trim();
    let parsed;
    try { parsed=JSON.parse(clean); }
    catch(je) {
      alert("Debug - Risposta AI:\n"+clean.substring(0,600));
      throw je;
    }

    if(mode==="fromNote"){
      state.presentStudents.forEach(name=>{
        const r=parsed[name]; if(!r)return;
        if(typeof r==="object") setEntry(name,{note:r.note||"",motivation:r.motivation||null,learning:r.learning||null,behaviour:r.behaviour||null});
        else setEntry(name,{note:String(r)});
      });
    } else {
      state.presentStudents.forEach(name=>{ if(parsed[name]) setEntry(name,{note:parsed[name]}); });
    }
    state.generated=true;
  } catch(e){ alert("Errore: "+e.message); }
  state.generating=false; state.generatingMode=null; render();
}

async function handleSave(){
  state.saving=true; render();
  const entries=state.presentStudents.map(name=>({name,...getEntry(name)}));
  try{
    await saveSession({
      group_id:`${state.sede}|${state.corso}|${state.giorno}`,
      group_name:`${state.corso} · ${state.giorno}`,
      sede:state.sede, corso:state.corso, giorno:state.giorno,
      session_date:state.sessionDate,
      story:null, day:null,
      group_note:state.groupNote||null,
      entries
    });
    state.saved=true;
  } catch(e){ alert("Errore nel salvataggio: "+e.message); }
  state.saving=false; render();
}

window.receiveNotes=function(j){ try{ const p=JSON.parse(j); Object.keys(p).forEach(n=>setEntry(n,{note:p[n]})); state.generated=true; }catch{} state.generating=false; render(); };
window.receiveError=function(m){ alert("Errore: "+m); state.generating=false; render(); };

try {
  render();
} catch(e) {
  document.getElementById("app").innerHTML = 
    "<div style='padding:20px;color:red;font-family:monospace;white-space:pre-wrap'>" +
    "<strong>ERRORE JS:</strong>\n" + e.message + "\n\nStack:\n" + e.stack +
    "</div>";
}
</script>
