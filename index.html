async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) throw new Error(await res.text());
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function loadHistory(groupId) {

  historyLoading: false,
  students: [],
  newStudent: "",
  presentStudents: [],
  selectedStory: "",
  selectedDay: "",
  groupNote: "",
  editedObjectives: null,
  // entries: { [name]: { note, motivation, learning, behaviour } }
  entries: {},
  generating: false,
  generatingMode: null, // "fromNote" | "fromEmoji"
  generated: false,
  saved: false,
  saving: false,
  copiedKey: null,
};

function getEntry(name) {
  return state.entries[name] || { note:"", motivation:null, learning:null, behaviour:null };
}
function setEntry(name, patch) {
  state.entries[name] = { ...getEntry(name), ...patch };
}

function getCurriculumObjectives(char, story, day) {
  const key = CURRICULUM_KEY[char];
  if (!key || !story || !day) return [];
  return CURRICULUM[key]?.[story]?.lessons?.[day] || [];
}
function fmtDate(iso) { const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function emojiFor(field, value) { return value ? (EMOJI_SCALE.find(e=>e.value===value)?.emoji || "—") : "—"; }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view==="home") renderHome(app);
  else if (state.view==="session") renderSession(app);
  else if (state.view==="history") renderHistory(app);
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if (k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else if (k==="class") e.className=v;
    else if (k==="disabled"&&v) e.disabled=true;
    else if (k==="rows") e.rows=v;
    else if (k==="placeholder") e.placeholder=v;
    else if (k==="value"&&(tag==="textarea"||tag==="input")) e.value=v;
    else e.setAttribute(k,v);
  }
  for (const c of children) {
    if (c==null) continue;
    if (typeof c==="string"||typeof c==="number") e.appendChild(document.createTextNode(c));
    else if (c instanceof Node) e.appendChild(c);
    else if (Array.isArray(c)) c.forEach(cc=>{ if(cc instanceof Node) e.appendChild(cc); });
  }
  return e;
}

function renderHome(root) {
  const header = el("div",{class:"header"},
    el("span",{class:"logo-text"},"🐭 Kids&Us Follow-Up"),
    el("button",{class:"btn-header",onClick:()=>{ state.view="history"; state.historyGroup=null; state.historyEntries=[]; render(); loadHistoryList(); }},"📋 Storico")
  );
  const body = el("div",{class:"home-body"});
  for (const level of LEVELS) {
    const lc = LEVEL_COLORS[level];
    const groups = GROUPS.filter(g=>g.level===level);
    const block = el("div",{class:"level-block"});
    const label = el("div",{class:"level-label",style:{background:lc.bg,color:lc.text,borderColor:lc.border}},level);
    const pills = el("div",{class:"group-pills"});
    groups.forEach(g=>{
      const btn = el("button",{class:"group-pill",style:{background:g.color},onClick:async()=>{
        state.selectedGroup=g;
        state.students=await loadStudents(g.id);
        state.presentStudents=[...state.students];
        state.selectedStory=""; state.selectedDay="";
        state.groupNote=""; state.editedObjectives=null;
        state.entries={}; state.generated=false; state.saved=false; state.newStudent="";
        state.view="session"; render();
      }},g.name);
      pills.appendChild(btn);
    });
    block.append(label,pills);
    body.appendChild(block);
  }
  root.append(header,body);
}

function renderSession(root) {
  const g = state.selectedGroup;
  const lc = LEVEL_COLORS[g.level];
  const charKey = CURRICULUM_KEY[g.char];
  const currStories = charKey ? Object.keys(CURRICULUM[charKey]||{}) : [];
  const currDays = (charKey&&state.selectedStory)
    ? Object.keys(CURRICULUM[charKey]?.[state.selectedStory]?.lessons||{})
        .sort((a,b)=>parseInt(a.split(" ")[1])-parseInt(b.split(" ")[1]))
    : [];
  const objectives = getCurriculumObjectives(g.char,state.selectedStory,state.selectedDay);

  const header = el("div",{class:"header"},
    el("button",{class:"btn-header",onClick:()=>{ state.view="home"; render(); }},"← Home"),
    el("span",{class:"level-pill",style:{background:lc.bg,color:lc.text}},g.level),
    el("span",{class:"logo-text"},g.name)
  );
  const body = el("div",{class:"body"});

  // ── LESSON CARD ──
  const lessonCard = el("div",{class:"card"},el("div",{class:"card-title"},"📖 Lezione"));
  if (!charKey) {
    lessonCard.appendChild(el("div",{class:"no-curriculum"},"📋 Curriculum non ancora disponibile."));
  } else {
    const storySelect = el("select",{});
    storySelect.innerHTML='<option value="">— Storia / Part —</option>';
    currStories.forEach(s=>{
      const title=CURRICULUM[charKey][s].title;
      const opt=document.createElement("option");
      opt.value=s; opt.textContent=title!==s?`${s} · ${title}`:s;
      if(s===state.selectedStory) opt.selected=true;
      storySelect.appendChild(opt);
    });
    storySelect.addEventListener("change",()=>{ state.selectedStory=storySelect.value; state.selectedDay=""; state.editedObjectives=null; state.generated=false; render(); });

    const daySelect = el("select",{});
    daySelect.innerHTML='<option value="">— Day —</option>';
    if(!state.selectedStory) daySelect.disabled=true;
    currDays.forEach(d=>{
      const opt=document.createElement("option");
      opt.value=d; opt.textContent=d;
      if(d===state.selectedDay) opt.selected=true;
      daySelect.appendChild(opt);
    });
    daySelect.addEventListener("change",()=>{ state.selectedDay=daySelect.value; state.editedObjectives=null; state.generated=false; render(); });
    lessonCard.appendChild(el("div",{class:"row"},storySelect,daySelect));

    if (objectives.length>0) {
      const defaultObjText = objectives.map(o=>"• "+o).join("\n");
      const currentObjText = state.editedObjectives!==null ? state.editedObjectives : defaultObjText;
      const objBox = el("div",{class:"objectives"});
      const objHeader = el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}});
      objHeader.appendChild(el("div",{class:"obj-title",style:{margin:"0"}},"✏️ Obiettivi lezione (modificabili)"));
      if (state.editedObjectives!==null) {
        objHeader.appendChild(el("button",{style:{fontSize:"11px",border:"1px solid #0d9488",borderRadius:"5px",padding:"2px 7px",cursor:"pointer",background:"#f0fdfa",color:"#0d9488",fontFamily:"Georgia, serif"},onClick:()=>{ state.editedObjectives=null; render(); }},"↺ Ripristina"));
      }
      objBox.appendChild(objHeader);
      const objTa = document.createElement("textarea");
      objTa.className="obj-textarea"; objTa.rows=objectives.length+1; objTa.value=currentObjText;
      objTa.addEventListener("input",e=>{ state.editedObjectives=e.target.value; });
      objBox.appendChild(objTa);
      lessonCard.appendChild(objBox);
    }
  }
  body.appendChild(lessonCard);

  // ── STUDENTS CARD ──
  const studCard = el("div",{class:"card"},el("div",{class:"card-title"},"👥 Presenze"));
  const grid = el("div",{class:"student-grid"});
  state.students.forEach(name=>{
    const present=state.presentStudents.includes(name);
    const btn=el("button",{class:"pres-btn "+(present?"present":"absent"),onClick:()=>{
      if(present) state.presentStudents=state.presentStudents.filter(s=>s!==name);
      else state.presentStudents=[...state.presentStudents,name];
      state.generated=false; render();
    }},(present?"✓ ":"✗ ")+name);
    const del=el("button",{class:"del-btn",onClick:()=>{
      state.students=state.students.filter(s=>s!==name);
      state.presentStudents=state.presentStudents.filter(s=>s!==name);
      persistStudents(g.id,state.students); render();
    }},"×");
    grid.appendChild(el("div",{class:"student-item"},btn,del));
  });
  const addInput=el("input",{type:"text",placeholder:"Aggiungi allievo...",value:state.newStudent});
  addInput.addEventListener("input",e=>{ state.newStudent=e.target.value; });
  addInput.addEventListener("keydown",e=>{ if(e.key==="Enter") doAddStudent(g); });
  studCard.append(grid,el("div",{class:"add-row"},addInput,el("button",{class:"add-btn",onClick:()=>doAddStudent(g)},"+"))); 
  body.appendChild(studCard);

  // ── NOTE + GENERATE CARD ──
  const noteCard = el("div",{class:"card"},el("div",{class:"card-title"},"📝 Nota di gruppo"));
  const ta = el("textarea",{rows:4,placeholder:"Descrivi la lezione: attività svolte, dinamiche del gruppo, chi si è distinto... (opzionale se usi solo le emoji)"});
  ta.value=state.groupNote;
  ta.addEventListener("input",e=>{ state.groupNote=e.target.value; });
  noteCard.appendChild(ta);

  const genRow = el("div",{class:"gen-row"});

  const spinnerHtml = state.generating ? '<span class="spinner"></span>' : '';

  // Btn A: da nota → genera note+emoji
  const btnFromNote = el("button",{
    class:"generate-btn",
    disabled: state.generating,
    onClick: ()=>handleGenerate("fromNote")
  });
  btnFromNote.innerHTML = state.generating&&state.generatingMode==="fromNote"
    ? `<span class="spinner"></span>Generando...`
    : "✨ Nota → Note + Emoji";

  // Btn B: da emoji → genera note
  const btnFromEmoji = el("button",{
    class:"generate-btn secondary",
    disabled: state.generating,
    onClick: ()=>handleGenerate("fromEmoji")
  });
  btnFromEmoji.innerHTML = state.generating&&state.generatingMode==="fromEmoji"
    ? `<span class="spinner"></span>Generando...`
    : "😊 Emoji → Note";

  genRow.append(btnFromNote, btnFromEmoji);
  noteCard.appendChild(genRow);
  noteCard.appendChild(el("div",{class:"mode-hint"},"Modalità A: scrivi la nota e genera tutto · Modalità B: assegna le emoji e genera i testi"));
  body.appendChild(noteCard);

  // ── ENTRIES CARD (always visible for present students) ──
  if (state.presentStudents.length>0) {
    const entriesCard = el("div",{class:"card"},el("div",{class:"card-title"},"👤 Valutazioni individuali"));

    state.presentStudents.forEach(name=>{
      const entry = getEntry(name);
      const hasData = entry.note || entry.motivation || entry.learning || entry.behaviour;
      const nc = el("div",{class:"entry-card"+(hasData?" has-data":"")});

      // Header
      const copied = state.copiedKey===name;
      const copyBtn = el("button",{class:"copy-btn"+(copied?" copied":""),onClick:()=>{
        navigator.clipboard.writeText(entry.note||"").catch(()=>{});
        state.copiedKey=name; render();
        setTimeout(()=>{ state.copiedKey=null; render(); },1500);
      }},copied?"✓ Copiato":"📋 Copia nota");
      nc.appendChild(el("div",{class:"entry-name"},el("span",{},name),copyBtn));

      // Emoji ratings
      const ratingsRow = el("div",{class:"ratings-row"});
      RATING_FIELDS.forEach(field=>{
        const rg = el("div",{class:"rating-group"});
        rg.appendChild(el("div",{class:"rating-label"},RATING_LABELS[field]));
        const emojiRow = el("div",{class:"emoji-row"});
        EMOJI_SCALE.forEach(es=>{
          const btn = el("button",{
            class:"emoji-btn"+(entry[field]===es.value?" selected":""),
            title: es.label,
            onClick:()=>{ setEntry(name,{[field]:entry[field]===es.value?null:es.value}); render(); }
          },es.emoji);
          emojiRow.appendChild(btn);
        });
        rg.appendChild(emojiRow);
        ratingsRow.appendChild(rg);
      });
      nc.appendChild(ratingsRow);

      // Note textarea
      const noteTa = el("textarea",{class:"note-txt",rows:3,placeholder:"Nota individuale (generata o scritta a mano)..."});
      noteTa.value=entry.note||"";
      noteTa.addEventListener("input",e=>{ setEntry(name,{note:e.target.value}); });
      nc.appendChild(noteTa);

      entriesCard.appendChild(nc);
    });

    // Save button
    if (!state.saved) {
      const saveBtn = el("button",{class:"save-btn",disabled:state.saving,onClick:handleSave});
      saveBtn.innerHTML = state.saving ? '<span class="spinner"></span>Salvando...' : "☁️ Salva su Supabase";
      entriesCard.appendChild(saveBtn);
    } else {
      entriesCard.appendChild(el("div",{class:"saved-msg"},"✅ Lezione salvata su Supabase!"));
    }

    body.appendChild(entriesCard);
  }

  root.append(header,body);
}

async function loadHistoryList() {
  // We'll load all groups that have history - check by loading a few
  // For now just render the group picker, history loads per-group
  render();
}

function renderHistory(root) {
  const header = el("div",{class:"header"},
    el("button",{class:"btn-header",onClick:()=>{ state.view="home"; state.historyGroup=null; render(); }},"← Home"),
    el("span",{class:"logo-text"},"📋 Storico")
  );
  const body = el("div",{class:"body"});

  if (!state.historyGroup) {
    body.appendChild(el("div",{class:"card-title",style:{marginBottom:"12px"}},"Seleziona un gruppo per vedere lo storico:"));
    const pills = el("div",{class:"group-pills"});
    GROUPS.forEach(g=>{
      const btn = el("button",{class:"group-pill",style:{background:g.color},onClick:async()=>{
        state.historyGroup=g; state.historyLoading=true; state.historyEntries=[]; render();
        try {
          state.historyEntries = await loadHistory(g.id);
        } catch(e) {
          state.historyEntries=[];
        }
        state.historyLoading=false; render();
      }},g.name);
      pills.appendChild(btn);
    });
    body.appendChild(pills);
  } else {
    const hg = state.historyGroup;
    body.appendChild(el("button",{class:"btn-back-sm",onClick:()=>{ state.historyGroup=null; render(); }},"← Gruppi"));
    body.appendChild(el("h2",{class:"history-title"},hg.name));

    if (state.historyLoading) {
      body.appendChild(el("div",{class:"empty"},"⏳ Caricamento..."));
    } else if (!state.historyEntries||state.historyEntries.length===0) {
      body.appendChild(el("div",{class:"empty"},"Nessuno storico trovato per questo gruppo."));
    } else {
      state.historyEntries.forEach(session=>{
        const card = el("div",{class:"history-card"});
        const meta = el("div",{class:"history-meta"},fmtDate(session.session_date));
        if (session.story) meta.appendChild(el("span",{class:"history-tag"},`${session.story} — ${session.day}`));
        card.appendChild(meta);
        if (session.group_note) card.appendChild(el("div",{class:"history-group-note"},"📝 "+session.group_note));
        const entries = session.entries||[];
        const presentNames = entries.map(e=>e.name).join(", ");
        if (presentNames) card.appendChild(el("div",{class:"history-present"},"Presenti: "+presentNames));
        entries.forEach(entry=>{
          const row = el("div",{class:"history-row"});
          const ratings = [
            entry.motivation ? emojiFor("motivation",entry.motivation) : "",
            entry.learning   ? emojiFor("learning",entry.learning)     : "",
            entry.behaviour  ? emojiFor("behaviour",entry.behaviour)   : "",
          ].filter(Boolean).join(" ");
          row.innerHTML=`<strong>${entry.name}:</strong>${ratings?' <span class="history-ratings">'+ratings+'</span>':''} ${entry.note||""}`;
          card.appendChild(row);
        });
        body.appendChild(card);
      });
    }
  }
  root.append(header,body);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function doAddStudent(g) {
  const name=state.newStudent.trim();
  if(!name||state.students.includes(name)) return;
  state.students=[...state.students,name];
  state.presentStudents=[...state.presentStudents,name];
  state.newStudent="";
  persistStudents(g.id,state.students); render();
}

function buildObjectivesText() {
  const g = state.selectedGroup;
  const objectives = getCurriculumObjectives(g.char,state.selectedStory,state.selectedDay);
  if (state.editedObjectives!==null&&state.editedObjectives.trim()) {
    return "Obiettivi didattici della lezione:\n"+state.editedObjectives.trim();
  } else if (objectives.length>0) {
    return "Obiettivi didattici della lezione:\n"+objectives.map((o,i)=>(i+1)+". "+o).join("\n");
  }
  return "";
}

function buildPromptFromNote() {
  const g = state.selectedGroup;
  const objText = buildObjectivesText();
  const present = state.presentStudents;
  return `Sei un assistente per insegnanti Kids&Us in Italia. Genera valutazioni interne per uso esclusivo dell'insegnante.
Livello: ${g.level}.
${objText}
Nota generale: "${state.groupNote}"
Allievi presenti: ${present.join(", ")}.

Per ciascun allievo presente genera:
1. Una nota valutativa in italiano di 2-3 frasi (professionale, oggettiva, riferita agli obiettivi)
2. Un valore numerico da 1 a 5 per ciascuna di queste tre dimensioni (1=Poor, 2=Satisfactory, 3=Good, 4=Very good, 5=Excellent):
   - motivation: motivazione e partecipazione alle attività
   - learning: apprendimento e raggiungimento degli obiettivi
   - behaviour: comportamento e gestione della classe

Rispondi SOLO con JSON valido, senza markdown, nel formato:
{"NomeAllievo": {"note": "testo", "motivation": 4, "learning": 3, "behaviour": 5}, ...}`;
}

function buildPromptFromEmoji() {
  const g = state.selectedGroup;
  const objText = buildObjectivesText();
  const present = state.presentStudents;
  const ratingsDesc = present.map(name=>{
    const e = getEntry(name);
    const parts = [];
    if(e.motivation) parts.push(`motivation: ${EMOJI_SCALE.find(x=>x.value===e.motivation)?.label}`);
    if(e.learning)   parts.push(`learning: ${EMOJI_SCALE.find(x=>x.value===e.learning)?.label}`);
    if(e.behaviour)  parts.push(`behaviour: ${EMOJI_SCALE.find(x=>x.value===e.behaviour)?.label}`);
    return `${name}: ${parts.length>0?parts.join(", "):"nessuna valutazione emoji"}`;
  }).join("\n");

  const noteContext = state.groupNote.trim()
    ? `\nContesto lezione: "${state.groupNote}"`
    : "";

  return `Sei un assistente per insegnanti Kids&Us in Italia. Genera note valutative interne basandoti sulle valutazioni emoji fornite dall'insegnante.
Livello: ${g.level}.
${objText}${noteContext}

Valutazioni emoji per ciascun allievo (scala: Poor=1, Satisfactory=2, Good=3, Very good=4, Excellent=5):
${ratingsDesc}

Per ciascun allievo scrivi una nota valutativa in italiano di 2-3 frasi coerente con i livelli indicati.
La nota deve essere professionale, oggettiva, e fare riferimento agli obiettivi della lezione quando disponibili.

Rispondi SOLO con JSON valido, senza markdown, nel formato:
{"NomeAllievo": "testo nota", ...}`;
}

async function handleGenerate(mode) {
  if (state.presentStudents.length===0) { alert("Segna almeno un allievo come presente."); return; }
  if (mode==="fromNote"&&!state.groupNote.trim()) { alert("Scrivi prima la nota di gruppo per usare questa modalità."); return; }
  if (mode==="fromEmoji") {
    const hasAnyEmoji = state.presentStudents.some(name=>{
      const e=getEntry(name); return e.motivation||e.learning||e.behaviour;
    });
    if(!hasAnyEmoji) { alert("Assegna almeno un'emoji a qualche allievo prima di generare."); return; }
  }

  state.generating=true; state.generatingMode=mode; render();

  const prompt = mode==="fromNote" ? buildPromptFromNote() : buildPromptFromEmoji();

  try {
    const resp = await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1500,
        messages:[{role:"user",content:prompt}]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).map(b=>b.text||"").join("");
    const parsed = JSON.parse(text.trim());

    if (mode==="fromNote") {
      // parsed = { name: { note, motivation, learning, behaviour } }
      state.presentStudents.forEach(name=>{
        const r = parsed[name];
        if(r) setEntry(name,{
          note: r.note||r||"",
          motivation: r.motivation||null,
          learning: r.learning||null,
          behaviour: r.behaviour||null
        });
      });
    } else {
      // parsed = { name: "note text" }
      state.presentStudents.forEach(name=>{
        if(parsed[name]) setEntry(name,{note:parsed[name]});
      });
    }
    state.generated=true;
  } catch(e) {
    alert("Errore durante la generazione: "+e.message);
  }
  state.generating=false; state.generatingMode=null; render();
}

async function handleSave() {
  state.saving=true; render();
  const g = state.selectedGroup;
  const today = new Date().toISOString().split("T")[0];
  const entries = state.presentStudents.map(name=>({ name, ...getEntry(name) }));
  const session = {
    group_id: g.id,
    group_name: g.name,
    session_date: today,
    story: state.selectedStory||null,
    day: state.selectedDay||null,
    group_note: state.groupNote||null,
    entries: entries
  };
  try {
    await saveSession(session);
    state.saved=true;
  } catch(e) {
    alert("Errore nel salvataggio: "+e.message);
  }
  state.saving=false; render();
}

// Scriptable bridge
window.receiveNotes=function(jsonStr){
  try { const p=JSON.parse(jsonStr); Object.keys(p).forEach(name=>setEntry(name,{note:p[name]})); state.generated=true; } catch{}
  state.generating=false; render();
};
window.receiveError=function(msg){ alert("Errore: "+msg); state.generating=false; render(); };

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>
